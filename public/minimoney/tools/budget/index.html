<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>남은 예산 계산기 | MiniMoney</title>
  <meta name="description" content="월 예산에 수입을 더하고 지출을 빼서 남은 금액을 확인해요.">
  <link rel="canonical" href="https://kimsoyeong.github.io/minimoney/tools/budget/">
  <link rel="alternate" hreflang="ko" href="https://kimsoyeong.github.io/minimoney/tools/budget/">
  <link rel="alternate" hreflang="en" href="https://kimsoyeong.github.io/minimoney/en/tools/budget/">
  <meta property="og:title" content="남은 예산 계산기 | MiniMoney">
  <meta property="og:description" content="월 예산에 수입을 더하고 지출을 빼서 남은 금액을 확인해요.">
  <meta property="og:url" content="https://kimsoyeong.github.io/minimoney/tools/budget/">
  <meta property="og:image" content="https://kimsoyeong.github.io/minimoney/assets/icon.jpg">
  <meta property="og:type" content="website">
  <link rel="icon" href="/minimoney/assets/icon.jpg" type="image/jpeg">
  <link rel="stylesheet" href="/minimoney/assets/style.css">
  <script src="/minimoney/assets/calculators.js" defer></script>
</head>
<body>
  <header class="shell masthead">
    <a class="wordmark" href="/minimoney/"><img src="/minimoney/assets/icon.jpg" alt="" width="34" height="34">미니머니</a>
    <nav class="navigation" aria-label="페이지 메뉴">
      <a href="/minimoney/#tools">계산기</a>
      <a href="/minimoney/en/tools/budget/" lang="en">English</a>
    </nav>
  </header>
  <main class="shell calculator">
    <h1>남은 예산 계산기</h1>
    <p class="lead">월 예산에 수입을 더하고 지출을 빼서 남은 금액을 확인해요.</p>
    <p class="description">수입을 예산에 넣지 않으려면 0원을 입력해요.</p>
    <form data-calculator="budget">
      <label class="field">월 예산 (원)<input type="number" id="budget" name="budget" inputmode="numeric" min="0" max="999999999999" step="1" value="1500000" required></label>
      <label class="field">포함할 수입 (원)<input type="number" id="income" name="income" inputmode="numeric" min="0" max="999999999999" step="1" value="0" required></label>
      <label class="field">지출 (원)<input type="number" id="spending" name="spending" inputmode="numeric" min="0" max="999999999999" step="1" value="450000" required></label>
      <button class="action" type="submit">계산하기</button>
      <div class="result" role="status">
        <span>계산 결과</span>
        <output for="budget income spending">—</output>
        <small></small>
      </div>
    </form>
    <p class="description">값은 브라우저에서만 계산해요.</p>
  </main>
  <footer>
    <nav class="shell" aria-label="하단 메뉴">
      <a href="/">개발자 블로그</a>
      <div class="links">
        <a href="/minimoney-web/">지원</a>
        <a href="/minimoney-web/privacy.html">개인정보 처리방침</a>
      </div>
    </nav>
  </footer>
</body>
</html>
