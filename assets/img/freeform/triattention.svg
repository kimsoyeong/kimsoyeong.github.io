<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="#E8F4EC"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="60" r="40" fill="#C8E6D0" opacity="0.6"/>
  <circle cx="70" cy="240" r="30" fill="#C8E6D0" opacity="0.4"/>

  <!-- Brain/Network shape -->
  <ellipse cx="200" cy="130" rx="65" ry="55" fill="#A7D5B8" opacity="0.5"/>
  <ellipse cx="200" cy="130" rx="50" ry="42" fill="#7FC49A"/>

  <!-- Neural connection dots -->
  <circle cx="175" cy="115" r="6" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="210" cy="108" r="5" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="195" cy="140" r="7" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="225" cy="130" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="180" cy="148" r="4.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Connection lines -->
  <line x1="175" y1="115" x2="210" y2="108" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="175" y1="115" x2="195" y2="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="210" y1="108" x2="225" y2="130" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="210" y1="108" x2="195" y2="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="195" y1="140" x2="225" y2="130" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="195" y1="140" x2="180" y2="148" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>

  <!-- Sine wave (trigonometric) -->
  <path d="M80 200 Q120 170, 160 200 Q200 230, 240 200 Q280 170, 320 200" stroke="#4A9E6B" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M80 215 Q120 185, 160 215 Q200 245, 240 215 Q280 185, 320 215" stroke="#4A9E6B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Triangle symbol (Tri) -->
  <polygon points="200,70 175,110 225,110" fill="none" stroke="#2D7A4A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Key icon -->
  <g transform="translate(290, 180)">
    <circle cx="0" cy="0" r="12" fill="#4A9E6B" opacity="0.7"/>
    <rect x="-2" y="10" width="4" height="18" rx="2" fill="#4A9E6B" opacity="0.7"/>
    <rect x="0" y="20" width="8" height="3" rx="1" fill="#4A9E6B" opacity="0.7"/>
  </g>

  <!-- Value icon -->
  <g transform="translate(105, 185)">
    <rect x="-14" y="-10" width="28" height="22" rx="4" fill="#4A9E6B" opacity="0.6"/>
    <text x="0" y="5" font-family="monospace" font-size="12" fill="white" text-anchor="middle" font-weight="bold">V</text>
  </g>

  <!-- Small label -->
  <text x="200" y="268" font-family="'DM Sans', sans-serif" font-size="13" fill="#3D6B4E" text-anchor="middle" font-weight="600" letter-spacing="0.08em">ATTENTION MECHANISM</text>
</svg>