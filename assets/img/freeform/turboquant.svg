<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="#EDE8F4"/>

  <!-- Decorative circles -->
  <circle cx="340" cy="50" r="35" fill="#D8CEE8" opacity="0.5"/>
  <circle cx="55" cy="250" r="25" fill="#D8CEE8" opacity="0.4"/>

  <!-- Quantization grid -->
  <g transform="translate(120, 60)">
    <!-- Grid rows -->
    <rect x="0" y="0" width="38" height="38" rx="6" fill="#C4B5D9"/>
    <rect x="42" y="0" width="38" height="38" rx="6" fill="#A78DC4"/>
    <rect x="84" y="0" width="38" height="38" rx="6" fill="#C4B5D9"/>
    <rect x="126" y="0" width="38" height="38" rx="6" fill="#8B6DB0"/>

    <rect x="0" y="42" width="38" height="38" rx="6" fill="#8B6DB0"/>
    <rect x="42" y="42" width="38" height="38" rx="6" fill="#C4B5D9"/>
    <rect x="84" y="42" width="38" height="38" rx="6" fill="#A78DC4"/>
    <rect x="126" y="42" width="38" height="38" rx="6" fill="#C4B5D9"/>

    <rect x="0" y="84" width="38" height="38" rx="6" fill="#A78DC4"/>
    <rect x="42" y="84" width="38" height="38" rx="6" fill="#8B6DB0"/>
    <rect x="84" y="84" width="38" height="38" rx="6" fill="#C4B5D9"/>
    <rect x="126" y="84" width="38" height="38" rx="6" fill="#A78DC4"/>

    <!-- Bit labels in cells -->
    <text x="19" y="24" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">01</text>
    <text x="61" y="24" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">10</text>
    <text x="103" y="24" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">11</text>
    <text x="145" y="24" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">00</text>

    <text x="19" y="66" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">11</text>
    <text x="61" y="66" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">00</text>
    <text x="103" y="66" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">01</text>
    <text x="145" y="66" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">10</text>

    <text x="19" y="108" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">10</text>
    <text x="61" y="108" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">11</text>
    <text x="103" y="108" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">00</text>
    <text x="145" y="108" font-family="monospace" font-size="11" fill="white" text-anchor="middle" opacity="0.9">01</text>
  </g>

  <!-- Compression arrow -->
  <g transform="translate(165, 195)">
    <path d="M0 0 L35 20 L0 40" fill="none" stroke="#7B5EA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 0 L70 20 L35 40" fill="none" stroke="#7B5EA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>

  <!-- Compressed result -->
  <g transform="translate(155, 230)">
    <rect x="0" y="0" width="28" height="28" rx="5" fill="#7B5EA7"/>
    <rect x="32" y="0" width="28" height="28" rx="5" fill="#9B7EC8"/>
    <rect x="64" y="0" width="28" height="28" rx="5" fill="#7B5EA7"/>

    <text x="14" y="18" font-family="monospace" font-size="9" fill="white" text-anchor="middle">2b</text>
    <text x="46" y="18" font-family="monospace" font-size="9" fill="white" text-anchor="middle">2b</text>
    <text x="78" y="18" font-family="monospace" font-size="9" fill="white" text-anchor="middle">2b</text>
  </g>

  <!-- Speed indicator -->
  <g transform="translate(280, 210)">
    <circle cx="20" cy="20" r="22" fill="none" stroke="#7B5EA7" stroke-width="2.5" opacity="0.6"/>
    <path d="M20 20 L20 6" stroke="#7B5EA7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M20 20 L30 25" stroke="#9B7EC8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="3" fill="#7B5EA7"/>
    <text x="20" y="55" font-family="monospace" font-size="9" fill="#7B5EA7" text-anchor="middle" font-weight="600">8x</text>
  </g>

  <!-- Label -->
  <text x="200" y="282" font-family="'DM Sans', sans-serif" font-size="13" fill="#5B4478" text-anchor="middle" font-weight="600" letter-spacing="0.08em">VECTOR QUANTIZATION</text>
</svg>