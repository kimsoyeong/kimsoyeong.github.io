<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background -->
  <rect width="400" height="300" rx="20" fill="#E8F4F2"/>

  <!-- Decorative circles -->
  <circle cx="355" cy="45" r="38" fill="#5BBFB5" opacity="0.18"/>
  <circle cx="48" cy="258" r="26" fill="#5BBFB5" opacity="0.15"/>

  <!-- Grid dots (subtle) -->
  <circle cx="60" cy="60" r="2" fill="#5BBFB5" opacity="0.3"/>
  <circle cx="340" cy="240" r="2" fill="#5BBFB5" opacity="0.3"/>
  <circle cx="340" cy="60" r="2" fill="#5BBFB5" opacity="0.2"/>
  <circle cx="60" cy="240" r="2" fill="#5BBFB5" opacity="0.2"/>

  <!-- === Causal Graph === -->

  <!-- Edges (arrows, drawn first) -->
  <!-- Node A → Node B -->
  <line x1="122" y1="108" x2="178" y2="108" stroke="#2A9D8F" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="178,104 186,108 178,112" fill="#2A9D8F" opacity="0.7"/>

  <!-- Node B → Node C -->
  <line x1="206" y1="122" x2="206" y2="158" stroke="#2A9D8F" stroke-width="1.8" stroke-opacity="0.7"/>
  <polygon points="202,158 206,166 210,158" fill="#2A9D8F" opacity="0.7"/>

  <!-- Node B → Node D -->
  <line x1="222" y1="108" x2="278" y2="108" stroke="#E76F51" stroke-width="2" stroke-opacity="0.75"/>
  <polygon points="278,104 286,108 278,112" fill="#E76F51" opacity="0.75"/>

  <!-- Node C → Node D -->
  <line x1="222" y1="174" x2="278" y2="122" stroke="#2A9D8F" stroke-width="1.8" stroke-opacity="0.6"/>
  <polygon points="275,116 284,118 280,126" fill="#2A9D8F" opacity="0.6"/>

  <!-- Node A → Node C (long skip) -->
  <path d="M 108 124 Q 108 174 188 174" stroke="#5BBFB5" stroke-width="1.5" stroke-opacity="0.45" fill="none" stroke-dasharray="5,3"/>
  <polygon points="185,170 193,174 185,178" fill="#5BBFB5" opacity="0.45"/>

  <!-- Nodes -->
  <!-- Node A -->
  <circle cx="108" cy="108" r="18" fill="#2A9D8F" opacity="0.92"/>
  <text x="108" y="113" font-family="'DM Sans', sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">A</text>

  <!-- Node B -->
  <circle cx="206" cy="108" r="18" fill="#2A9D8F" opacity="0.92"/>
  <text x="206" y="113" font-family="'DM Sans', sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">B</text>

  <!-- Node C -->
  <circle cx="206" cy="174" r="18" fill="#2A9D8F" opacity="0.92"/>
  <text x="206" y="179" font-family="'DM Sans', sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">C</text>

  <!-- Node D (root cause — highlighted) -->
  <circle cx="296" cy="108" r="22" fill="#E76F51" opacity="0.95"/>
  <circle cx="296" cy="108" r="27" fill="none" stroke="#E76F51" stroke-width="2" stroke-opacity="0.35"/>
  <text x="296" y="113" font-family="'DM Sans', sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="700">D</text>

  <!-- Root cause label -->
  <rect x="268" y="82" width="56" height="14" rx="4" fill="#E76F51" opacity="0.15"/>
  <text x="296" y="92" font-family="'DM Sans', sans-serif" font-size="8" fill="#C1440E" text-anchor="middle" font-weight="600" letter-spacing="0.04em">ROOT CAUSE</text>

  <!-- Weight labels on key edges -->
  <rect x="140" y="98" width="26" height="13" rx="3" fill="white" opacity="0.8"/>
  <text x="153" y="108" font-family="'DM Sans', sans-serif" font-size="9" fill="#2A9D8F" text-anchor="middle" font-weight="600">0.82</text>

  <rect x="242" y="98" width="26" height="13" rx="3" fill="white" opacity="0.8"/>
  <text x="255" y="108" font-family="'DM Sans', sans-serif" font-size="9" fill="#E76F51" text-anchor="middle" font-weight="600">0.71</text>

  <!-- Chain label at bottom -->
  <text x="200" y="218" font-family="'DM Sans', sans-serif" font-size="10" fill="#2A9D8F" text-anchor="middle" font-weight="500" opacity="0.7" letter-spacing="0.05em">Event Chain  A → B → D</text>

  <!-- Bottom label -->
  <text x="200" y="282" font-family="'DM Sans', sans-serif" font-size="13" fill="#1A6B63" text-anchor="middle" font-weight="600" letter-spacing="0.08em">CHAIN-OF-EVENT · RCA</text>
</svg>
